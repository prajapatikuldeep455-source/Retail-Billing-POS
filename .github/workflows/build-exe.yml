name: Build POS EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-package-lock

      - name: Build React UI
        run: npm run build

      - name: Bundle Node.js Server
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --target=node20 --outfile=server.cjs --external:better-sqlite3

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps
        env:
          npm_config_build_from_source: true

      - name: Remove better-sqlite3 prebuilds to prevent ABI mismatch crashes
        run: Remove-Item -Recurse -Force node_modules/better-sqlite3/prebuilds -ErrorAction SilentlyContinue

      - name: Build Electron EXE
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS-Machine-Windows
          path: release/*.exe
